<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BadyTouch — Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--blush:#fbeef0;--rose:#e8b4bc;--rose-deep:#c9788a;--gold:#b98a5b;--plum:#3b1f2b;--cream:#fffaf7;--ink:#5a4048;--line:#f0dadd;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--blush);min-height:100vh}
h1,h2,h3{font-family:var(--serif);color:var(--plum);font-weight:600}
.logo{font-family:var(--serif);font-size:1.6rem;color:var(--plum);font-weight:600}.logo span{color:var(--rose-deep);font-style:italic}
button{font-family:var(--sans);cursor:pointer}
.btn{padding:12px 24px;border-radius:50px;border:1px solid var(--rose-deep);background:transparent;color:var(--rose-deep);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;font-weight:500;transition:.25s}
.btn:hover{background:var(--rose-deep);color:#fff}
.btn.fill{background:linear-gradient(135deg,var(--rose-deep),#b5627a);color:#fff;border-color:transparent}
.btn.sm{padding:8px 16px;font-size:.66rem}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
.btn.danger{border-color:#c9566a;color:#c9566a}.btn.danger:hover{background:#c9566a;color:#fff}

/* LOGIN */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 10%,#f8d9de,transparent 50%),var(--blush)}
.card{background:#fff;border-radius:24px;padding:36px;box-shadow:0 30px 60px -35px rgba(201,120,138,.55)}
#login .card{width:100%;max-width:400px;text-align:center}
#login .logo{font-size:2.2rem}
#login p.sub{font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--rose-deep);margin:6px 0 26px}
.field{margin-bottom:16px;text-align:left}
.field label{display:block;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--rose-deep);margin-bottom:6px;font-weight:500}
.field input,.field textarea,.field select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--cream);font:inherit;color:var(--plum);outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--rose-deep);box-shadow:0 0 0 4px rgba(232,180,188,.3)}
.field textarea{min-height:80px;resize:vertical}
.err{color:#c9566a;font-size:.85rem;margin-top:10px;min-height:1.2em}

/* APP */
#app{display:none}
header{background:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 1px 0 var(--line);gap:10px;flex-wrap:wrap}
header .r{display:flex;gap:10px;align-items:center}
header a{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--rose-deep);text-decoration:none}
.tabs{display:flex;gap:6px;padding:16px 22px 0;overflow-x:auto;max-width:960px;margin:auto}
.tab{background:#fff;border:0;padding:12px 22px;border-radius:50px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);white-space:nowrap;position:relative}
.tab.on{background:var(--plum);color:#fff}
.tab .dot{background:var(--rose-deep);color:#fff;border-radius:50px;font-size:.62rem;padding:1px 7px;margin-left:6px}
main{max-width:960px;margin:auto;padding:20px 22px 80px}
.panel{display:none}.panel.on{display:block}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border:0}
.row .t{font-family:var(--serif);font-size:1.3rem;color:var(--plum);font-weight:600}
.row .m{font-size:.85rem;color:#8a7078}
.row .pr{font-family:var(--serif);font-size:1.3rem;color:var(--gold);font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.cols{grid-template-columns:1fr}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:20px}
.pitem{border-radius:14px;overflow:hidden;background:var(--cream);border:1px solid var(--line)}
.pitem img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pitem div{padding:8px 10px;font-size:.8rem;display:flex;justify-content:space-between;align-items:center;gap:6px}
.pitem button{background:none;border:0;color:#c9566a;font-size:1.1rem}
.msg{padding:18px 0;border-bottom:1px solid var(--line)}
.msg .body{background:var(--cream);padding:12px 14px;border-radius:12px;margin:10px 0;font-size:.92rem;white-space:pre-wrap}
.empty{text-align:center;padding:30px;font-family:var(--serif);font-style:italic;font-size:1.2rem;color:#a58e95}
.card+.card{margin-top:18px}
h2{font-size:1.7rem;margin-bottom:16px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--plum);color:#fff;padding:12px 24px;border-radius:50px;font-size:.85rem;transition:.4s;z-index:99}
#toast.show{transform:translateX(-50%)}
.warn{background:#fff3e0;border:1px solid #f0c78a;padding:14px 18px;border-radius:14px;font-size:.9rem;margin:20px auto;max-width:960px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <div class="logo">Bady<span>Touch</span></div>
    <p class="sub">Admin Dashboard</p>
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div>
    <button class="btn fill" style="width:100%" id="loginBtn">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="logo">Bady<span>Touch</span> <small style="font-size:.7rem;letter-spacing:.2em;color:var(--rose-deep);font-family:var(--sans)">ADMIN</small></div>
    <div class="r"><a href="index.html" target="_blank">View site ↗</a><button class="btn sm" id="logout">Sign out</button></div>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab on" data-p="services">Services</button>
    <button class="tab" data-p="portfolio">Portfolio</button>
    <button class="tab" data-p="messages">Messages <span class="dot" id="msgCount" style="display:none">0</span></button>
    <button class="tab" data-p="settings">Settings</button>
  </div>

  <main>
    <!-- SERVICES -->
    <div class="panel on" id="p-services">
      <div class="card">
        <h2 id="svcFormTitle">Add a service</h2>
        <div class="cols">
          <div class="field"><label>Category</label><input id="sCat" placeholder="Makeup, Lashes, Hair…" list="catList"><datalist id="catList"></datalist></div>
          <div class="field"><label>Service name</label><input id="sName" placeholder="Bridal Makeup"></div>
          <div class="field"><label>Price (as you want it shown)</label><input id="sPrice" placeholder="₦50,000"></div>
          <div class="field"><label>Short description (optional)</label><input id="sDesc" placeholder="Trial included"></div>
        </div>
        <div class="acts"><button class="btn fill" id="saveSvc">Save service</button><button class="btn" id="cancelSvc" style="display:none">Cancel edit</button></div>
      </div>
      <div class="card"><h2>Your services</h2><div id="svcList"></div></div>
    </div>

    <!-- PORTFOLIO -->
    <div class="panel" id="p-portfolio">
      <div class="card">
        <h2>Upload to portfolio</h2>
        <div class="field"><label>Photos (you can pick many)</label><input type="file" id="pFiles" accept="image/*" multiple></div>
        <div class="field"><label>Or paste image links (one per line)</label><textarea id="pUrls" placeholder="https://example.com/photo1.jpg&#10;https://example.com/photo2.jpg"></textarea></div>
        <div class="field"><label>Caption (optional)</label><input id="pCap" placeholder="Soft glam for Zainab"></div>
        <button class="btn fill" id="upBtn">Upload</button>
        <p class="m" id="upStatus" style="margin-top:10px;font-size:.85rem"></p>
      </div>
      <div class="card"><h2>Your portfolio</h2><div class="pgrid" id="pGrid"></div></div>
    </div>

    <!-- MESSAGES -->
    <div class="panel" id="p-messages">
      <div class="card"><h2>Client enquiries</h2>
        <p class="m" style="margin-bottom:10px;font-size:.88rem">Every message a client sends is also saved here. Tap “Reply on WhatsApp” to continue the chat with them.</p>
        <div id="msgList"></div></div>
    </div>

    <!-- SETTINGS -->
    <div class="panel" id="p-settings">
      <div class="card">
        <h2>Site settings</h2>
        <div class="field"><label>WhatsApp number (with country code, e.g. 2348012345678)</label><input id="stWa" inputmode="numeric"></div>
        <div class="field"><label>Tagline (under the main heading)</label><input id="stTag"></div>
        <div class="field"><label>About text</label><textarea id="stAbout"></textarea></div>
        <div class="field"><label>Address / footer line</label><input id="stAddr"></div>
        <div class="cols">
          <div class="field"><label>Instagram link</label><input id="stIg" placeholder="https://instagram.com/…"></div>
          <div class="field"><label>TikTok link</label><input id="stTt" placeholder="https://tiktok.com/@…"></div>
        </div>
        <button class="btn fill" id="saveSet">Save settings</button>
      </div>
    </div>
  </main>
</div>

<div id="toast"></div>
<script src="config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = t => { const e = $("toast"); e.textContent = t; e.classList.add("show"); setTimeout(() => e.classList.remove("show"), 2400); };

const cfg = window.BT_FIREBASE || {};
if (!cfg.apiKey || cfg.apiKey.startsWith("YOUR")) {
  $("login").innerHTML = '<div class="card" style="max-width:440px"><h2>Almost there ✦</h2><p>Open <b>config.js</b> and paste your Firebase details, then reload this page.</p></div>';
  throw new Error("Firebase not configured");
}

const app = initializeApp(cfg);
const auth = getAuth(app);
const db = getFirestore(app);
let services = [], editingId = null, unsubs = [];

/* ---------- Auth ---------- */
$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
  catch { $("loginErr").textContent = "Incorrect email or password."; }
};
$("pass").addEventListener("keydown", e => e.key === "Enter" && $("loginBtn").click());
$("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  $("login").style.display = user ? "none" : "grid";
  $("app").style.display = user ? "block" : "none";
  unsubs.forEach(u => u()); unsubs = [];
  if (user) start();
});

/* ---------- Tabs ---------- */
$("tabs").onclick = e => {
  const b = e.target.closest(".tab"); if (!b) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === b));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-" + b.dataset.p));
};

function start() {
  /* Services */
  unsubs.push(onSnapshot(collection(db, "services"), snap => {
    services = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.category || "").localeCompare(b.category || "") || (a.order ?? 0) - (b.order ?? 0));
    $("catList").innerHTML = [...new Set(services.map(s => s.category).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join("");
    $("svcList").innerHTML = services.length ? services.map(s => `
      <div class="row"><div><div class="t">${esc(s.name)}</div><div class="m">${esc(s.category || "")}${s.description ? " · " + esc(s.description) : ""}</div></div>
      <div class="pr">${esc(s.price)}</div>
      <div class="acts"><button class="btn sm" data-edit="${s.id}">Edit</button><button class="btn sm danger" data-del="${s.id}">Delete</button></div></div>`).join("")
      : '<p class="empty">No services yet — add your first one above ✦</p>';
  }, err => toast("Permission problem: check Firestore rules")));

  /* Portfolio */
  unsubs.push(onSnapshot(collection(db, "portfolio"), snap => {
    const items = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    $("pGrid").innerHTML = items.length ? items.map(p => `<div class="pitem"><img src="${p.image}" alt=""><div><span>${esc(p.caption || "")}</span><button data-pdel="${p.id}" title="Delete">✕</button></div></div>`).join("")
      : '<p class="empty" style="grid-column:1/-1">No photos yet ✦</p>';
  }));

  /* Messages */
  unsubs.push(onSnapshot(collection(db, "inquiries"), snap => {
    const items = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    const c = $("msgCount"); c.textContent = items.length; c.style.display = items.length ? "inline" : "none";
    $("msgList").innerHTML = items.length ? items.map(m => {
      const when = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleString() : "";
      const reply = `Hello ${m.name}, this is BadyTouch ✨ Thank you for reaching out! `;
      return `<div class="msg"><div class="row" style="border:0;padding:0"><div><div class="t">${esc(m.name)}</div><div class="m">${esc(m.phone)} · ${esc(when)}</div></div></div>
        <div class="body">${m.service ? "<b>Service:</b> " + esc(m.service) + "\n" : ""}${m.date ? "<b>Date:</b> " + esc(m.date) + "\n" : ""}${esc(m.message || "—")}</div>
        <div class="acts"><a class="btn sm wa" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${esc(m.phone)}?text=${encodeURIComponent(reply)}">Reply on WhatsApp</a>
        <button class="btn sm danger" data-mdel="${m.id}">Delete</button></div></div>`;
    }).join("") : '<p class="empty">No messages yet ✦</p>';
  }));

  /* Settings */
  unsubs.push(onSnapshot(doc(db, "settings", "site"), d => {
    const s = d.data() || {};
    if (document.activeElement && document.activeElement.closest("#p-settings")) return; // don't overwrite while typing
    $("stWa").value = s.whatsapp || window.BT_DEFAULT_WHATSAPP || "";
    $("stTag").value = s.tagline || ""; $("stAbout").value = s.about || "";
    $("stAddr").value = s.address || ""; $("stIg").value = s.instagram || ""; $("stTt").value = s.tiktok || "";
  }));
}

/* ---------- Services actions ---------- */
function resetSvcForm() {
  editingId = null;
  ["sCat","sName","sPrice","sDesc"].forEach(i => $(i).value = "");
  $("svcFormTitle").textContent = "Add a service"; $("cancelSvc").style.display = "none";
}
$("cancelSvc").onclick = resetSvcForm;
$("saveSvc").onclick = async () => {
  const data = { category: $("sCat").value.trim() || "Services", name: $("sName").value.trim(), price: $("sPrice").value.trim(), description: $("sDesc").value.trim() };
  if (!data.name || !data.price) return toast("Please add a name and a price");
  try {
    if (editingId) await updateDoc(doc(db, "services", editingId), data);
    else await addDoc(collection(db, "services"), { ...data, order: Date.now(), createdAt: serverTimestamp() });
    toast("Saved — live on your site ✦"); resetSvcForm();
  } catch { toast("Could not save. Check Firestore rules."); }
};
$("svcList").onclick = async e => {
  const ed = e.target.dataset.edit, del = e.target.dataset.del;
  if (ed) {
    const s = services.find(x => x.id === ed); editingId = ed;
    $("sCat").value = s.category || ""; $("sName").value = s.name || ""; $("sPrice").value = s.price || ""; $("sDesc").value = s.description || "";
    $("svcFormTitle").textContent = "Edit service"; $("cancelSvc").style.display = "inline-block"; scrollTo({ top: 0, behavior: "smooth" });
  }
  if (del && confirm("Delete this service?")) { await deleteDoc(doc(db, "services", del)); toast("Deleted"); }
};

/* ---------- Portfolio upload (compressed, stored in Firestore) ---------- */
function compress(file, max = 1000, q = .78) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let out = c.toDataURL("image/jpeg", q);
      if (out.length > 950000) out = c.toDataURL("image/jpeg", .55);
      out.length > 1000000 ? rej(new Error("too big")) : res(out);
    };
    img.onerror = () => rej(new Error("bad image"));
    img.src = url;
  });
}
$("upBtn").onclick = async () => {
  const files = [...$("pFiles").files];
  const urls = $("pUrls").value.split(/\s+/).map(u => u.trim()).filter(Boolean);
  if (!files.length && !urls.length) return toast("Choose a photo or paste an image link");
  const caption = $("pCap").value.trim();
  const total = files.length + urls.length;
  let ok = 0, n = 0;

  for (const f of files) {
    $("upStatus").textContent = `Uploading ${++n} of ${total}…`;
    try {
      const image = await compress(f);
      await addDoc(collection(db, "portfolio"), { image, caption, createdAt: serverTimestamp() });
      ok++;
    } catch { toast(`Skipped ${f.name}`); }
  }

  for (const url of urls) {
    $("upStatus").textContent = `Uploading ${++n} of ${total}…`;
    if (!/^https?:\/\//i.test(url)) { toast("Skipped a link that doesn't start with http(s)://"); continue; }
    const loads = await new Promise(r => { const i = new Image(); i.onload = () => r(true); i.onerror = () => r(false); i.src = url; });
    if (!loads) { toast("Skipped a link that isn't a viewable image"); continue; }
    try {
      await addDoc(collection(db, "portfolio"), { image: url, caption, source: "url", createdAt: serverTimestamp() });
      ok++;
    } catch { toast("Could not save a link"); }
  }

  $("upStatus").textContent = `${ok} photo(s) published ✦`;
  $("pFiles").value = ""; $("pUrls").value = ""; $("pCap").value = "";
};
$("pGrid").onclick = async e => {
  const id = e.target.dataset.pdel;
  if (id && confirm("Remove this photo from the site?")) { await deleteDoc(doc(db, "portfolio", id)); toast("Removed"); }
};

/* ---------- Messages ---------- */
$("msgList").onclick = async e => {
  const id = e.target.dataset.mdel;
  if (id && confirm("Delete this message?")) await deleteDoc(doc(db, "inquiries", id));
};

/* ---------- Settings ---------- */
$("saveSet").onclick = async () => {
  try {
    await setDoc(doc(db, "settings", "site"), {
      whatsapp: $("stWa").value.replace(/\D/g, ""), tagline: $("stTag").value.trim(), about: $("stAbout").value.trim(),
      address: $("stAddr").value.trim(), instagram: $("stIg").value.trim(), tiktok: $("stTt").value.trim()
    }, { merge: true });
    toast("Settings saved — live ✦");
  } catch { toast("Could not save settings"); }
};
</script>
</body>
</html>
